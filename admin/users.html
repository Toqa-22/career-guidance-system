<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Users</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/admin-pages.css">
<link rel="stylesheet" href="../css/notifications.css">
<script src="../js/theme-rotator.js"></script>
<script src="../js/notify.js"></script>
</head>
<body>

<header class="admin-page-header">
    <div class="admin-header-shape admin-header-shape-1"></div>
    <div class="admin-header-shape admin-header-shape-2"></div>
    <div class="admin-header-shape admin-header-shape-3"></div>
    <div class="admin-header-shape admin-header-shape-4"></div>
    <div class="admin-page-header-left">
        <a class="admin-page-back" href="../hub.html">← Hub</a>
        <h1>Admin</h1>
        <nav class="admin-page-tabs">
            <a class="admin-page-tab active" href="users.html">Users</a>
            <a class="admin-page-tab" href="logins.html">Login History</a>
            <a class="admin-page-tab" href="institutions.html">Ibra Department</a>
            <a class="admin-page-tab" href="halls.html">Halls</a>
            <a class="admin-page-tab" href="add-institution.html">Add Institution</a>
            <a class="admin-page-tab" href="deletion-log.html">Deletion Log</a>
        </nav>
    </div>
    <a class="admin-logout-link" href="#" onclick="logoutHubAdmin(); return false;">Logout</a>
</header>

<div class="admin-page-body">
    <div class="admin-card">
        <h2>Add User</h2>
        <div class="admin-form-row">
            <div><label>Username</label><input type="text" id="newUsername" placeholder="e.g. reception"></div>
            <div><label>Full Name</label><input type="text" id="newFullName" placeholder="e.g. Fatma Al-Balushi"></div>
            <div><label>Password</label><input type="password" id="newPassword" placeholder="Password"></div>
            <button class="admin-btn" id="addUserBtn">+ Add</button>
        </div>
        <p class="admin-note" id="addUserNote"></p>
    </div>

    <div class="admin-card">
        <h2>User Logins</h2>
        <table class="admin-table">
            <thead><tr><th>Username</th><th>Full Name</th><th>Created</th><th></th></tr></thead>
            <tbody id="usersTableBody">
                <tr class="admin-empty-row"><td colspan="4">Loading…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module" src="../js/admin-users.js"></script>
</body>
</html>
