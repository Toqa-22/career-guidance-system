<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/logo-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../assets/logo-192.png">
<link rel="apple-touch-icon" href="../assets/logo-192.png">
<title>Get Your Certificate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/workshops.css">
<link rel="stylesheet" href="css/notifications.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="js/notify.js"></script>
</head>
<body>

<div class="simple-page-container">

    <div class="simple-header">
        <div class="brand-icon" aria-hidden="true">
            <img src="assets/logo.png" alt="Ibra Hospital" class="brand-logo-img">
        </div>
        <p class="simple-header-kicker">Ibra Hospital<br>Professional Development and Career Guidance</p>
        <h1>Get Your Certificate</h1>
        <p>Enter your staff number to claim your certificate for this course.</p>
    </div>

    <div class="form-card" style="max-width: 480px; margin: 0 auto;">

        <div id="staffNumberStep">
            <label style="font-size:14px; font-weight:bold; color:#334155; display:block; margin-bottom:8px;">Enter your Staff Number</label>
            <input type="text" id="certStaffNumberInput" placeholder="e.g. EMP1001" style="margin-bottom:16px;">
            <button class="btn-register" id="checkEmailBtn" style="width:100%;">Check</button>
            <div id="checkEmailError" class="hidden-element" style="margin-top:16px; background:#fff5f5; border:1px solid #fed7d7; color:#b91c1c; padding:16px; border-radius:12px; font-size:14px; line-height:1.5;"></div>
        </div>

        <div id="verifiedStep" class="hidden-element">
            <div style="background:#f0fdf4; border:1px solid #bbf7d0; color:#166534; padding:14px 18px; border-radius:12px; font-weight:bold; margin-bottom:20px;">✓ Staff number verified</div>

            <div style="margin-bottom:14px;">
                <div style="font-size:12px; color:#64748b; font-weight:bold; text-transform:uppercase; letter-spacing:.03em;">Name</div>
                <div id="verifiedName" style="font-size:18px; color:#0f172a;"></div>
            </div>
            <div style="margin-bottom:24px;">
                <div style="font-size:12px; color:#64748b; font-weight:bold; text-transform:uppercase; letter-spacing:.03em;">Course</div>
                <div id="verifiedCourse" style="font-size:18px; color:#0f172a;"></div>
            </div>

            <!-- Shown instead of the Get Certificate button when this certificate
                 requires one or more evaluations/exams that haven't all been
                 completed yet (set from Create Certificate -> "Required
                 Evaluation(s) / Exam(s)") — walked through ONE AT A TIME: a
                 single button for the next requirement, opened in a new tab;
                 when the participant comes back, this tab re-checks and
                 shows the "solved!" card below before moving to the next
                 one, or to Get Certificate once nothing is left. See
                 renderPendingState()/recheckPending() in js/certificate-public.js. -->
            <div id="pendingEvaluationNotice" class="hidden-element" style="background:#FEF3C7; border:1px solid #FDE68A; color:#92400E; padding:14px 18px; border-radius:12px; font-weight:600; font-size:14px; margin-bottom:16px;">
                <span id="pendingEvaluationText">Please complete the following before this certificate can be issued:</span>
                <div id="pendingEvaluationLinks" style="display:flex; flex-direction:column; gap:8px; margin-top:10px;"></div>
                <div id="pendingEvaluationRemaining" class="hidden-element" style="margin-top:8px; font-size:12.5px; font-weight:600; color:#92400E; opacity:.85;"></div>
            </div>

            <div style="display:flex; gap:10px;">
                <button class="btn-register" id="getCertificateBtn" style="flex:1;">Get Certificate</button>
                <button type="button" class="btn-register" id="closeCertBtn" style="flex:none; width:auto; padding:0 22px; background:white; color:#64748b; border:2px solid #e2e8f0;">Close</button>
            </div>
            <div id="generateStatus" style="margin-top:16px; font-size:14px; color:#64748b; text-align:center;"></div>
        </div>

    </div>
</div>

<!-- ============ REQUIREMENT SOLVED (centered, overlays the whole page) ============ -->
<!-- Shown when this tab regains focus and a re-check finds the participant
     has completed the requirement they just opened in another tab. -->
<div class="form-modal-overlay hidden-element" id="requirementDoneOverlay">
    <div class="form-modal-card" style="max-width:420px; text-align:center;">
        <div style="font-size:46px; line-height:1; color:#16a34a; margin-bottom:14px;">✓</div>
        <p style="font-weight:700; font-size:16px; color:#166534; margin:0 0 8px;">Successfully completed!</p>
        <p id="requirementDoneMessage" style="font-size:14px; color:#334155; margin:0 0 24px;"></p>
        <button type="button" class="btn-register" id="requirementDoneCloseBtn" style="width:auto; padding:10px 34px;">Continue</button>
    </div>
</div>

<script type="module" src="js/certificate-public.js?v=2"></script>
</body>
</html>
