<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Your Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/hub-login.css">
<link rel="stylesheet" href="css/notifications.css">
<link rel="stylesheet" href="css/responsive.css">
<script src="js/notify.js"></script>
<script src="js/theme-rotator.js"></script>
</head>
<body class="full-bleed">

<div class="login-page">
    <div class="login-brand-panel">
        <div class="login-shape login-shape-1" aria-hidden="true"></div>
        <div class="login-shape login-shape-2" aria-hidden="true"></div>
        <div class="login-shape login-shape-3" aria-hidden="true"></div>
        <div class="login-shape login-shape-4" aria-hidden="true"></div>
        <div class="login-shape login-shape-5" aria-hidden="true"></div>
        <div class="login-shape login-shape-6" aria-hidden="true"></div>
        <div class="login-brand-content">
            <div class="login-brand-icon" aria-hidden="true">
                <img src="assets/logo.png" alt="Ibra Hospital" class="brand-logo-img">
            </div>
            <h2>Welcome</h2>
            <p>This is your first time signing in — set your own password before continuing.</p>
        </div>
    </div>

    <div class="login-form-panel">
        <div id="loginBox">
            <h3>Set your password</h3>
            <p class="sub">Choose a new password and enter it twice to confirm.</p>
            <p id="loginError">Passwords don't match.</p>
            <div class="password-field-wrap">
                <input type="password" id="newPassword" placeholder="New password" autocomplete="new-password">
                <button type="button" id="toggleNewPasswordBtn" class="password-toggle-btn" aria-label="Show password">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <div class="password-field-wrap">
                <input type="password" id="confirmPassword" placeholder="Confirm new password" autocomplete="new-password">
                <button type="button" id="toggleConfirmPasswordBtn" class="password-toggle-btn" aria-label="Show password">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </div>
            <div class="login-actions">
                <button id="loginSubmitBtn" type="button" onclick="attemptSetPassword()">Save &amp; Continue</button>
            </div>
        </div>
    </div>
</div>

<script type="module" src="js/first-login.js"></script>
</body>
</html>
